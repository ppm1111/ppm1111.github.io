<script>
(function () {
  var q = document.getElementById('q'), none = document.getElementById('none');
  if (!q) return;
  q.addEventListener('input', function () {
    var kw = q.value.trim().toLowerCase(), any = false;
    document.querySelectorAll('.card').forEach(function (card) {
      var hit = 0;
      card.querySelectorAll('li').forEach(function (li) {
        var show = !kw || li.textContent.toLowerCase().indexOf(kw) !== -1;
        li.hidden = !show; if (show) hit++;
      });
      card.hidden = hit === 0; if (hit) any = true;
    });
    none.hidden = any;
  });
})();
</script>
