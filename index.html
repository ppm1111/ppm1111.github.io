<script>
(function () {
  var q = document.getElementById('q'), none = document.getElementById('none');
  if (!q) return;
  q.addEventListener('input', function () {
    var kw = q.value.trim().toLowerCase(), any = false;
    document.querySelectorAll('.card').forEach(function (card) {
      var hit = 0;
      card.querySelectorAll('li').forEach(function (li) {
        var show = !kw || li.textContent.toLowerCase().indexOf(kw) !== -1;
        li.hidden = !show; if (show) hit++;
      });
      card.hidden = hit === 0; if (hit) any = true;
    });
    none.hidden = any;
  });
})();
</script>
<script>
(function () {
  var form = document.getElementById('login'), root = document.documentElement;
  if (!form) return;
  var user = document.getElementById('login-user'), pass = document.getElementById('login-pass');
  var err = document.getElementById('login-error');
  if (root.className.indexOf('locked') !== -1) user.focus();
  function fail(msg) { err.textContent = msg; err.hidden = false; }
  function enter() {
    try { sessionStorage.setItem('wiki-auth', '590c783dce35634a13f99f7b25482678536c9a39cf153f1bb83554aa0362e5d1'); } catch (e) {}
    var next = new URLSearchParams(location.search).get('next');
    if (next) {
      try {
        var u = new URL(next, location.href);
        if (u.protocol === location.protocol && u.host === location.host) { location.replace(u.href); return; }
      } catch (e) {}
    }
    root.className = root.className.replace(/\blocked\b/, '');
  }
  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (!(window.crypto && crypto.subtle)) { fail('這個瀏覽器環境無法驗證（需要 HTTPS）'); return; }
    var data = new TextEncoder().encode(user.value.trim() + ':' + pass.value);
    crypto.subtle.digest('SHA-256', data).then(function (buf) {
      var hex = Array.prototype.map.call(new Uint8Array(buf), function (b) {
        return ('0' + b.toString(16)).slice(-2);
      }).join('');
      if (hex === '590c783dce35634a13f99f7b25482678536c9a39cf153f1bb83554aa0362e5d1') { enter(); }
      else { fail('帳號或密碼錯誤'); pass.value = ''; pass.focus(); }
    });
  });
})();
</script>
